<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#0B2412"/><g transform="translate(600,470) scale(3.2)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#0E2A17"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#0E2A17"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#0A1F11"/></g><text x="84" y="180" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#C9D3C4">Nobody:</text><text x="84" y="250" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#C9D3C4">Absolutely nobody:</text><line x1="84" y1="300" x2="996" y2="300" stroke="#1E3A28" stroke-width="2"/><text x="84" y="372" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#96A08F">Your water heater, 2 a.m., the night</text><text x="84" y="412" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#96A08F">before ten guests arrive:</text><text x="84" y="560" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="88" fill="#F3F1E8">“Okay.</text><text x="84" y="664" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="88" fill="#F3F1E8">I’m ready</text><text x="84" y="768" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="88" fill="#16A34A">to go now.”</text><line x1="84" y1="946" x2="996" y2="946" stroke="#1E3A28" stroke-width="2"/><g transform="translate(84,978) scale(0.3)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/></g><text x="140" y="1014" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#F3F1E8">Strech</text><line x1="290" y1="988" x2="290" y2="1014" stroke="#96A08F" stroke-width="1.5" opacity="0.5"/><text x="310" y="1010" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#96A08F">Owning a home shouldn&#x27;t require managing one.</text><circle cx="984" cy="1002" r="5" fill="#C9A227"/><text x="968" y="1008" text-anchor="end" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1.5" fill="#96A08F">BETA</text></svg>