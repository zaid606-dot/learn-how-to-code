<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#F6F3EC"/><text x="84" y="150" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3" fill="#5A6353">HOW THE JOB ACTUALLY GETS DONE</text><line x1="84" y1="168" x2="150" y2="168" stroke="#C9A227" stroke-width="3"/><text x="120" y="308" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" fill="#96A08F">✗</text><text x="185" y="308" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" fill="#5A6353">Ask the neighbor if they know a guy</text><line x1="185" y1="292" x2="920" y2="292" stroke="#96A08F" stroke-width="1.4" opacity="0.35"/><text x="120" y="418" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" fill="#96A08F">✗</text><text x="185" y="418" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" fill="#5A6353">Post in the group chat, get 40 replies</text><line x1="185" y1="402" x2="920" y2="402" stroke="#96A08F" stroke-width="1.4" opacity="0.35"/><text x="120" y="528" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" fill="#96A08F">✗</text><text x="185" y="528" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" fill="#5A6353">Text the guy from 2019. No response.</text><line x1="185" y1="512" x2="920" y2="512" stroke="#96A08F" stroke-width="1.4" opacity="0.35"/><rect x="84" y="564" width="912" height="150" rx="24" fill="#E4F7EC"/><g transform="translate(120,580) scale(0.34)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#16A34A" stroke="#E4F7EC" stroke-width="16" stroke-linejoin="round"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#16A34A" stroke="#E4F7EC" stroke-width="16" stroke-linejoin="round"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#16A34A" stroke="#E4F7EC" stroke-width="16" stroke-linejoin="round"/></g><text x="230" y="650" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#16211A">Book it. Someone comes.</text><line x1="84" y1="946" x2="996" y2="946" stroke="#E3DED0" stroke-width="2"/><g transform="translate(84,978) scale(0.3)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#16A34A" stroke="#F6F3EC" stroke-width="18" stroke-linejoin="round"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#16A34A" stroke="#F6F3EC" stroke-width="18" stroke-linejoin="round"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#16A34A" stroke="#F6F3EC" stroke-width="18" stroke-linejoin="round"/></g><text x="140" y="1014" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#16211A">Strech</text><line x1="290" y1="988" x2="290" y2="1014" stroke="#5A6353" stroke-width="1.5" opacity="0.5"/><text x="310" y="1010" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#5A6353">Owning a home shouldn&#x27;t require managing one.</text><circle cx="984" cy="1002" r="5" fill="#C9A227"/><text x="968" y="1008" text-anchor="end" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1.5" fill="#5A6353">BETA</text></svg>