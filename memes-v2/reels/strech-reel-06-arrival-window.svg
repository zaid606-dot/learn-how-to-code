<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#0B2412"/><g transform="translate(560,760) scale(3.6)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#0E2A17"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#0E2A17"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#0A1F11"/></g><text x="84" y="400" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="3.5" fill="#96A08F">THE ARRIVAL WINDOW</text><line x1="84" y1="422" x2="156" y2="422" stroke="#C9A227" stroke-width="3"/><text x="84" y="640" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="150" fill="#F3F1E8">“Between</text><text x="84" y="800" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="150" fill="#F3F1E8">8 and 4.”</text><text x="84" y="920" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#96A08F">My entire Saturday, held hostage</text><text x="84" y="972" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#96A08F">by someone else’s schedule.</text><rect x="84" y="1080" width="912" height="30" rx="15" fill="#1E3A28"/><rect x="84" y="1080" width="820" height="30" rx="15" fill="#C9A227"/><text x="84" y="1160" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#96A08F">8:00 AM</text><text x="996" y="1160" text-anchor="end" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#96A08F">3:58 PM · still waiting</text><text x="84" y="1320" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="60" fill="#16A34A">We wait. You don’t.</text><line x1="84" y1="1654" x2="996" y2="1654" stroke="#1E3A28" stroke-width="2"/><g transform="translate(84,1688) scale(0.34)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/></g><text x="152" y="1728" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#F3F1E8">Strech</text><line x1="324" y1="1698" x2="324" y2="1728" stroke="#96A08F" stroke-width="1.5" opacity="0.5"/><text x="346" y="1723" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#96A08F">Owning a home shouldn&#x27;t require managing one.</text><circle cx="996" cy="1716" r="6" fill="#C9A227"/><text x="976" y="1723" text-anchor="end" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#96A08F">BETA</text></svg>