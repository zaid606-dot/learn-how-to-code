<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#F6F3EC"/><text x="84" y="400" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="3.5" fill="#5A6353">FIND THE DIFFERENCE</text><line x1="84" y1="422" x2="156" y2="422" stroke="#C9A227" stroke-width="3"/><rect x="84" y="470" width="912" height="290" rx="28" fill="#FFFFFF" stroke="#E3DED0" stroke-width="2"/><text x="540" y="600" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#16211A">“I’ll get to it</text><text x="540" y="668" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#16211A">this weekend.”</text><g transform="translate(486,760) scale(1.55)" opacity="0.85"><polygon points="0,40.5 59.4,0 59.4,63" fill="#EFEADD"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#EFEADD"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#E7E2D4"/></g><rect x="84" y="1010" width="912" height="290" rx="28" fill="#FFFFFF" stroke="#E3DED0" stroke-width="2"/><text x="540" y="1140" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#16211A">“I’ll never</text><text x="540" y="1208" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#16211A">get to it.”</text><text x="540" y="1460" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="72" fill="#16A34A">They’re the same picture.</text><text x="540" y="1520" text-anchor="middle" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#5A6353">One of them, we can fix.</text><line x1="84" y1="1654" x2="996" y2="1654" stroke="#E3DED0" stroke-width="2"/><g transform="translate(84,1688) scale(0.34)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#16A34A" stroke="#F6F3EC" stroke-width="18" stroke-linejoin="round"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#16A34A" stroke="#F6F3EC" stroke-width="18" stroke-linejoin="round"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#16A34A" stroke="#F6F3EC" stroke-width="18" stroke-linejoin="round"/></g><text x="152" y="1728" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#16211A">Strech</text><line x1="324" y1="1698" x2="324" y2="1728" stroke="#5A6353" stroke-width="1.5" opacity="0.5"/><text x="346" y="1723" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#5A6353">Owning a home shouldn&#x27;t require managing one.</text><circle cx="996" cy="1716" r="6" fill="#C9A227"/><text x="976" y="1723" text-anchor="end" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#5A6353">BETA</text></svg>