<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#0B2412"/><g transform="translate(560,900) scale(4.4)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#0E2A17"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#0E2A17"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#0A1F11"/></g><text x="84" y="430" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="500" fill="#C9D3C4">Nobody:</text><text x="84" y="520" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="500" fill="#C9D3C4">Absolutely nobody:</text><line x1="84" y1="588" x2="996" y2="588" stroke="#1E3A28" stroke-width="2"/><text x="84" y="680" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#96A08F">Your water heater, 2 a.m., the night</text><text x="84" y="728" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#96A08F">before ten guests arrive:</text><text x="84" y="1000" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="118" fill="#F3F1E8">“Okay.</text><text x="84" y="1130" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="118" fill="#F3F1E8">I’m ready</text><text x="84" y="1260" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="118" fill="#16A34A">to go now.”</text><line x1="84" y1="1654" x2="996" y2="1654" stroke="#1E3A28" stroke-width="2"/><g transform="translate(84,1688) scale(0.34)" opacity="1.0"><polygon points="0,40.5 59.4,0 59.4,63" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/><polygon points="0,40.5 117.9,86.4 64.8,126 0,100.8" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/><polygon points="117.9,86.4 117.9,145.8 64.8,180 64.8,126" fill="#16A34A" stroke="#0B2412" stroke-width="18" stroke-linejoin="round"/></g><text x="152" y="1728" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#F3F1E8">Strech</text><line x1="324" y1="1698" x2="324" y2="1728" stroke="#96A08F" stroke-width="1.5" opacity="0.5"/><text x="346" y="1723" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#96A08F">Owning a home shouldn&#x27;t require managing one.</text><circle cx="996" cy="1716" r="6" fill="#C9A227"/><text x="976" y="1723" text-anchor="end" font-family="Albert Sans, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#96A08F">BETA</text></svg>