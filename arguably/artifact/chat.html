<div class="app">
  <header class="topbar">
    <button class="back-btn" id="backBtn" type="button" aria-label="Back to home" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="brand" id="homeBtn" type="button" aria-label="Arguably home">
      <img class="brand-mark" src="__ICON_URI__" alt="" width="32" height="32">Arguably
    </button>
    <div class="chat-title" id="chatTitle" hidden></div>
    <div class="top-actions" id="topActions" hidden>
      <button class="top-icon" id="inboxBtn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge" id="inboxBadge" hidden></span>
      </button>
      <button class="top-icon" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <button class="skip-btn" id="skipBtn" type="button" hidden>Skip</button>
    <button class="new-btn" id="newBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New
    </button>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-inner">
      <p id="notice" class="notice" hidden></p>
      <div class="attach-strip" id="attachStrip" hidden></div>
      <div class="suggestions" id="suggestions" hidden></div>
      <div class="compose-row">
        <label class="icon-btn attach-btn" id="attachBtn" title="Import screenshots">
          <input id="fileInput" type="file" accept="image/*" multiple>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span class="visually-hidden">Import screenshots</span>
        </label>
        <label for="messageInput" class="visually-hidden">Message</label>
        <textarea id="messageInput" rows="1" maxlength="20000" placeholder="Or paste the conversation"></textarea>
        <button class="icon-btn send-btn" id="sendBtn" type="submit" aria-label="Send">
          <svg class="i-send" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="cost-note">Replies use your Claude account.</p>
    </div>
  </form>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
